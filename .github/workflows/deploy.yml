# 自动构建并部署到 GitHub Pages
# 首次使用前，请在仓库 Settings → Pages → Build and deployment 中，
# 把 Source 改为 "GitHub Actions"。
name: Deploy to GitHub Pages

on:
  # 推送到 main 分支时自动部署
  push:
    branches: [main]
  # 也可以在 Actions 页面手动触发
  workflow_dispatch:

# 设置 Pages 部署所需的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一次部署，避免并发冲突
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
